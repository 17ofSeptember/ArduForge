name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the environment fields. Arduino problems are very often
        platform or clone specific, and the answers change the diagnosis.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Opened the Dashboard tab
        2. Clicked Connect
        3. Expected live values, got "stale" immediately
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.2, Windows 11 23H2, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v22.13.0
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: arduino-cli version
      description: Output of `arduino-cli version`.
      placeholder: arduino-cli 1.5.1
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board
      placeholder: Arduino Uno R3
    validations:
      required: true

  - type: dropdown
    id: genuine
    attributes:
      label: Is the board genuine or a clone?
      description: >
        Clones frequently use a different USB vendor id and a CH340 serial chip,
        which changes both detection and driver requirements. "Not sure" is a
        perfectly good answer.
      options:
        - Genuine Arduino
        - Clone
        - Not sure
    validations:
      required: true

  - type: input
    id: port
    attributes:
      label: Port
      description: >
        What the OS calls it. macOS `/dev/cu.usbmodem14201`, Linux
        `/dev/ttyACM0`, Windows `COM3`.
      placeholder: /dev/cu.usbmodem14201

  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: >
        Anything the backend printed. This is automatically formatted as code,
        so no backticks needed.
      render: shell
